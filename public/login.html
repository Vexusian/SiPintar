<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiPintar - Masuk sebagai Guru</title>
    <!-- Tailwind CSS CDN agar bisa langsung tampil tanpa perlu build/backend -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#2b6288',
                        'primary-hover': '#235070',
                        'brand-navy': '#1e3e5c',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f0f4f8] min-h-screen flex items-center justify-center p-4 relative font-sans text-slate-800 antialiased selection:bg-blue-100">

    <!-- Badge UI-001 (Pojok Kiri Atas) -->
    <div class="absolute top-6 left-6">
        <span class="inline-flex items-center px-4 py-1 rounded-full text-xs font-semibold border border-[#7ba2c2] text-[#2b6288] bg-white/70 shadow-2xs">
            UI-001
        </span>
    </div>

    <!-- Card Login -->
    <div class="w-full max-w-[440px] bg-white rounded-2xl border border-slate-300 shadow-sm p-8 sm:p-10">
        <!-- Logo / Nama Aplikasi -->
        <div class="text-left">
            <h1 class="text-2xl sm:text-[26px] font-bold text-brand-navy tracking-tight">
                SiPintar
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Sistem Informasi Akademik Sekolah
            </p>
        </div>

        <!-- Garis Pemisah -->
        <hr class="my-6 border-slate-200">

        <!-- Judul Halaman -->
        <div class="text-left mb-6">
            <h2 class="text-base sm:text-lg font-bold text-slate-800">
                Masuk sebagai Guru
            </h2>
            <p class="text-xs text-slate-500 mt-1">
                Gunakan akun guru yang telah terdaftar.
            </p>
        </div>

        <!-- Form Login (Frontend Only) -->
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
            <!-- Field Username -->
            <div>
                <label for="username" class="block text-xs font-bold text-slate-800 mb-2">
                    Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Masukkan username" 
                    class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary-blue focus:border-transparent transition-all"
                >
            </div>

            <!-- Field Password -->
            <div>
                <label for="password" class="block text-xs font-bold text-slate-800 mb-2">
                    Password
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Masukkan password" 
                        class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary-blue focus:border-transparent transition-all pr-11"
                    >
                    <!-- Tombol Lihat/Sembunyikan Password -->
                    <button 
                        type="button" 
                        id="toggleBtn" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
                        aria-label="Tampilkan password"
                    >
                        <!-- Ikon Mata Terbuka -->
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <!-- Ikon Mata Tertutup (Hidden) -->
                        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tombol Masuk -->
            <button 
                type="submit" 
                class="w-full mt-6 py-2.5 sm:py-3 bg-primary-blue hover:bg-primary-hover active:bg-slate-900 text-white font-semibold text-sm rounded-lg shadow-sm transition-all duration-150 cursor-pointer"
            >
                Masuk
            </button>
        </form>

        <!-- Pesan Kesalahan / Helper Status -->
        <p id="errorFeedback" class="text-center text-xs text-slate-400 mt-4 leading-relaxed transition-colors">
            Pesan kesalahan tampil di sini jika data akun tidak sesuai.
        </p>
    </div>

    <!-- Script Interaktivitas Frontend Sederhana -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', isPassword);
            eyeClosed.classList.toggle('hidden', !isPassword);
        }

        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const feedback = document.getElementById('errorFeedback');

            if (!username || !password) {
                feedback.textContent = 'Silakan masukkan username dan password.';
                feedback.className = 'text-center text-xs text-red-500 font-medium mt-4 leading-relaxed';
            } else {
                feedback.textContent = 'Berhasil masuk! (Mode Frontend)';
                feedback.className = 'text-center text-xs text-emerald-600 font-medium mt-4 leading-relaxed';
            }
        }
    </script>
</body>
</html>
